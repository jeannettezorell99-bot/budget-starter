<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6e5f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Monatsflash Budget-Starter</title>
<style>
:root{--acc:#0b6e5f;--soft:#dcefea;--inp:#fff3b0;--grey:#f2f5f4;--line:#c9d4d0;--txt:#1d2a27;--mut:#5b6b67;--red:#b3261e;--redbg:#f8d0cc;--amber:#fbe3b0;--green:#cdebd0;--bg:#fafcfb}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--txt);background:var(--bg);padding-bottom:84px}
header{background:var(--acc);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0}
header button{background:transparent;border:0;color:#fff;font-size:24px;padding:4px 8px}
main{max-width:760px;margin:0 auto;padding:16px}
h2{font-size:22px;color:var(--acc);margin:4px 0 4px}
h3{font-size:17px;color:var(--acc);margin:22px 0 6px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.card.soft{background:var(--soft);border-color:var(--soft)}
.msg{background:var(--soft);border-radius:12px;padding:12px;font-weight:600;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.name{font-weight:700}
.hint{font-size:13px;color:var(--mut)}
input,select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--inp);width:100%;min-width:0;color:var(--txt)}
input.txt{background:#fff}
.calc{background:var(--grey);border:1px solid var(--line);border-radius:8px;padding:8px;font-weight:700;text-align:right;min-height:38px}
.weeks{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.weeks label{font-size:11px;color:var(--mut);display:block;text-align:center}
.weeks input{text-align:right;padding:8px 4px}
.weeks input.over{background:var(--redbg);color:#8a1c14;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:13px;margin-top:6px}
.stats b{display:block;font-size:15px}
.neg{color:var(--red)}
.badge{padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--grey)}
.b-ok{background:var(--green);color:#1b5e20}.b-knapp{background:var(--amber);color:#7a4b00}.b-drueber{background:var(--redbg);color:#8a1c14}.b-toll{background:#a5d6a7;color:#1b5e20}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin:0 -4px}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font:inherit;font-size:14px}
.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lab{font-size:12px;color:var(--mut);margin:6px 0 2px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600}
.btn.sec{background:#fff;color:var(--acc);border:1px solid var(--acc)}
.btn.red{background:#fff;color:var(--red);border:1px solid var(--red)}
.bar{height:10px;background:var(--grey);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:#4fc3ae;width:0}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:transparent;padding:8px 2px 10px;font:inherit;font-size:12px;color:var(--mut)}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--acc);font-weight:700}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--acc);color:#fff;padding:6px 4px;font-size:12px}
td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:right;white-space:nowrap}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:#fff}
th:first-child{background:var(--acc)}
tr.tot td{font-weight:700;background:var(--grey)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.tile b{display:block;font-size:20px;color:var(--acc)}
.tile span{font-size:12px;color:var(--mut)}
.menu{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:none}
.menu.on{display:block}
.menu div{background:#fff;margin:60px 16px 0 auto;max-width:320px;border-radius:12px;padding:12px;display:grid;gap:8px}
.x{border:0;background:transparent;color:var(--red);font-size:20px}
ol{padding-left:20px}
.wc{font-size:13px;padding:8px 2px;text-align:center;min-height:38px;font-weight:600}
.wc.over{background:var(--redbg);color:#8a1c14}
.scanbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.scanbtns .btn{padding:12px 8px}
textarea{font:inherit;width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;padding:8px}
.pos{border-top:1px solid var(--line);padding:8px 0}
.pos:first-child{border-top:0}
.pos.unsure{background:#fff8e1;border-radius:8px;padding:8px}
.pos .r1{display:flex;gap:6px}
.pos .r1 input:first-child{flex:1}
.pos .r1 input:last-child{width:96px;text-align:right}
details.bon{border:1px solid var(--line);border-radius:10px;margin:6px 0;background:#fff}
details.bon summary{padding:10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.erow{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-top:1px solid var(--line);font-size:14px;align-items:center}
.erow small{color:var(--mut);display:block}
.ok{color:#1b5e20}.err{color:var(--red)}
.chk{font-weight:700;margin:8px 0}.chk.err{color:var(--red)}
nav button{font-size:11px}
@media print{header,nav,.chips,.btn{display:none}body{padding:0}}
</style>
</head>
<body>
<header><h1>Budget-Starter</h1><button id="menuBtn" aria-label="Menü">⋯</button></header>
<main id="main"></main>
<nav id="nav">
<button data-v="start"><span>🏠</span>Start</button>
<button data-v="budget"><span>🎯</span>Budget</button>
<button data-v="erfassen"><span>🧾</span>Erfassen</button>
<button data-v="monat"><span>📅</span>Monat</button>
<button data-v="rueck"><span>🐷</span>Rücklagen</button>
<button data-v="jahr"><span>📊</span>Jahr</button>
</nav>
<div class="menu" id="menu"><div>
<div><div class="lab">Freischaltcode</div><input class="txt" id="codeIn" placeholder="Code eingeben" autocomplete="off" autocapitalize="characters"><button class="btn sec" id="mCode" style="width:100%;margin-top:6px">Freischalten</button><div class="hint" id="codeMsg"></div></div>
<button class="btn sec" id="mExport">Sicherung speichern</button>
<button class="btn sec" id="mImport">Sicherung laden</button>
<button class="btn sec" id="mPrint">Seite drucken</button>
<button class="btn sec" id="mNew">Neues Jahr beginnen</button>
<button class="btn red" id="mReset">Alles löschen</button>
<button class="btn" id="mClose">Schließen</button>
<input type="file" id="file" accept=".json,application/json" style="display:none">
</div></div>

  var RE_KG=/^(\d+,\d{1,3})\s*kg\s*[x×]\s*(\d+,\d{2})(?:\s*EUR\s*\/\s*kg)?$/i;
  var RE_QTY=/^(.+?)\s+(\d+,\d{2})\s*[x×]\s*(\d+)\s+(-?\d{1,4},\d{2})\s*[AB]?\s*\*?$/;
  var RE_ITEM=/^(.+?)\s+(-?\d{1,4},\d{2})\s*[AB]?\s*\*?$/;
  var RE_END=/^\s*(zu zahlen|summe\b|gesamtbetrag|total\b)/i;

  function kiDate(x){
    x=String(x||"").trim();var m;
    if((m=x.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/)))return m[3]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0");
    if((m=x.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2})$/)))return "20"+m[3]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0");
    if((m=x.match(/^(\d{4})-(\d{2})-(\d{2})$/)))return x;
    return null;
  }
  // Antwort einer KI im Format "Bon-Nr.;Datum;Geschäft;Artikel;Betrag" plus Zeile "Summe laut Bon: ..."
  function parseKi(text,regeln){
    var lines=String(text).replace(/\r/g,"").split("\n").map(function(x){return x.trim()}).filter(function(x){return x&&x.indexOf("```")!==0});
    var rows=[],summeBon=null;
    lines.forEach(function(l){
      var m=l.match(/^Summe laut (?:Bon|Rechnung|Kassenbon)\s*:?\s*(-?\d{1,5}[.,]\d{2})/i);
      if(m){summeBon=toNum(m[1]);return}
      var c=l.split(";");
      if(c.length>=5){
        var b=c[c.length-1].trim().replace(/\s|€|EUR/g,"");
        if(/^-?\d+([.,]\d{1,2})?$/.test(b))rows.push({datum:c[1].trim(),markt:c[2].trim(),name:c.slice(3,c.length-1).join(" ").trim(),betrag:toNum(b)});
      }
    });
    if(!rows.length)return null;
    var pos=[],warn=[];
    rows.forEach(function(r){
      var last=pos[pos.length-1];
      if(r.betrag<0&&/rabatt|gutschein|coupon|preisvorteil|nachlass/i.test(r.name)&&last){last.rabatt=r2(last.rabatt+r.betrag);return}
      pos.push({name:r.name,menge:1,einheit:"Stk",einzel:r.betrag,brutto:r.betrag,rabatt:0});
    });
    var markt=null,datum=null;
    rows.forEach(function(r){if(!markt&&r.markt)markt=r.markt;if(!datum)datum=kiDate(r.datum)});
    pos.forEach(function(q){
      q.netto=r2(q.brutto+q.rabatt);
      var c=classify(q.name,markt,regeln);q.gruppe=c.gruppe;q.sicher=c.sicher;q.gelernt=!!c.gelernt;
    });
    var sum=r2(pos.reduce(function(a,q){return a+q.netto},0));
    if(summeBon===null)warn.push("Die Zeile „Summe laut Bon“ fehlt in der Antwort, deshalb kann die Summe nicht geprüft werden.");
    else if(Math.abs(summeBon-sum)>0.004)warn.push("Die erkannten Positionen ergeben "+sum.toFixed(2).replace(".",",")+" €, der Bon sagt "+summeBon.toFixed(2).replace(".",",")+" €. Bitte Beträge und fehlende Zeilen prüfen.");
    if(/\[unleserlich\]/i.test(text))warn.push("Mindestens eine Zeile war unleserlich. Bitte Name und Betrag ergänzen.");
    return {markt:markt,datum:datum,belegNr:null,summeBon:summeBon,summe:sum,positionen:pos,warnungen:warn,stimmt:summeBon!==null&&Math.abs(summeBon-sum)<=0.004};
  }

  function parseBon(text,regeln){
    var kiRes=parseKi(text,regeln);if(kiRes)return kiRes;
    var lines=String(text).replace(/\r/g,"").replace(/[−–—]/g,"-").split("\n").map(function(s){return s.replace(/\s+/g," ").trim()});
    var endIdx=-1,summeBon=null;
    for(var i=0;i<lines.length;i++){
      if(RE_END.test(lines[i])){
        var m=lines[i].match(/(-?\d{1,5},\d{2})\s*(?:EUR|€)?\s*$/);
        endIdx=i;if(m)summeBon=toNum(m[1]);
        if(m)break;
      }
    }
    var body=endIdx>=0?lines.slice(0,endIdx):lines;
    var rest=endIdx>=0?lines.slice(endIdx):[];
    var pos=[],warn=[];
    body.forEach(function(ln){
      if(!ln)return;
      var m,last=pos[pos.length-1];
      if((m=ln.match(RE_DISC))){
        if(last){last.rabatt=r2(last.rabatt+toNum(m[2].replace(/\s/g,"")))}else warn.push("Rabattzeile ohne Artikel: "+ln);
        return;
      }
      if((m=ln.match(RE_STK))){if(last){last.menge=parseInt(m[1],10);last.einheit="Stk";last.einzel=toNum(m[2])}return}
      if((m=ln.match(RE_KG))){if(last){last.menge=toNum(m[1]);last.einheit="kg";last.einzel=toNum(m[2])}return}
      if((m=ln.match(RE_QTY))&&/[A-Za-zÄÖÜäöü]{2}/.test(m[1])){
        pos.push({name:m[1].trim(),menge:parseInt(m[3],10),einheit:"Stk",einzel:toNum(m[2]),brutto:toNum(m[4]),rabatt:0});return;
      }
      if((m=ln.match(RE_ITEM))&&/[A-Za-zÄÖÜäöü]{2}/.test(m[1])){
        var t=toNum(m[2]);
        pos.push({name:m[1].trim(),menge:1,einheit:"Stk",einzel:t,brutto:t,rabatt:0});
      }
    });

    var head=lines.slice(0,15).join("\n"),markt=null;
    for(var j=0;j<MAERKTE.length&&!markt;j++){if(MAERKTE[j][0].test(head))markt=MAERKTE[j][1]}
    if(!markt){for(var k=0;k<MAERKTE.length&&!markt;k++){if(MAERKTE[k][0].test(text))markt=MAERKTE[k][1]}}
    if(!markt&&/lidl plus/i.test(text))markt="Lidl";

    pos.forEach(function(p){
      p.netto=r2(p.brutto+p.rabatt);
      var c=classify(p.name,markt,regeln);p.gruppe=c.gruppe;p.sicher=c.sicher;p.gelernt=!!c.gelernt;
    });
    var sum=r2(pos.reduce(function(a,p){return a+p.netto},0));

    var datum=null,after=rest.join("\n"),dm;
    var reD=/\b(\d{2})\.(\d{2})\.(\d{4}|\d{2})\b/g;
    [after,lines.join("\n")].some(function(src){
      reD.lastIndex=0;
      while((dm=reD.exec(src))){
        var d=+dm[1],mo=+dm[2],y=dm[3].length===2?2000+ +dm[3]:+dm[3];
        if(d>=1&&d<=31&&mo>=1&&mo<=12&&y>=2000&&y<=2100){datum=y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0");return true}
      }
      return false;
    });

    var bn=(text.match(/Beleg-?\s*Nr\.?:?\s*(\d+)/i)||text.match(/Bon-?\s*Nr\.?:?\s*(\d+)/i));
    var belegNr=bn?bn[1]:null;

    if(!pos.length)warn.push("Keine Positionen erkannt.");
    if(summeBon===null)warn.push("Die Summe laut Bon wurde nicht gefunden, deshalb kann nicht geprüft werden, ob alles erkannt wurde.");
    else if(Math.abs(summeBon-sum)>0.004)warn.push("Die erkannten Positionen ergeben "+sum.toFixed(2).replace(".",",")+" €, der Bon sagt "+summeBon.toFixed(2).replace(".",",")+" €. Bitte Beträge und fehlende Zeilen prüfen.");
    return {markt:markt,datum:datum,belegNr:belegNr,summeBon:summeBon,summe:sum,positionen:pos,warnungen:warn,stimmt:summeBon!==null&&Math.abs(summeBon-sum)<=0.004};
  }

  return {KAT:KAT,BEREICH:BEREICH,NZ:NZ,migrate:migrate,parseBon:parseBon,classify:classify,normKey:normKey};
})();


</script>
<script>
"use strict";
const KEY="budgetstarter.v1";
const MON=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const MONL=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const TOEPFE=[
["Lebensmittel & Getränke","Essen und Trinken aus Supermarkt und Bäcker (auch Pfand)"],
["Drogerie & Haushalt","Putzmittel, Waschpulver, Zahnpasta, Shampoo, Hygiene"],
["Kind","Windeln und Babynahrung (nur der laufende Bedarf)"],
["Tanken","Nur Kraftstoff fürs Auto"],
["Tierfutter","Futter für Haustiere"],
["Außer Haus","Restaurant, Café, Lieferdienst, Imbiss"],
["Freizeit","Ausflüge, Hobby, Vereine, Kino, Kultur"],
["Eigener Topf 1","Frei: dein eigener Alltags-Topf (Name und Beschreibung änderbar)"],
["Eigener Topf 2","Frei: dein eigener Alltags-Topf"],
["Eigener Topf 3","Frei: dein eigener Alltags-Topf"]];
const RUECK=[
["Auto","TÜV, Inspektion, Reifen"],
["Kind","Autositz, nächste Kleidergröße, Fahrrad"],
["Feste & Geschenke","Weihnachten, Geburtstage"],
["Urlaub","Sommerurlaub"],
["Haus","Reparaturen, Möbel, Renovieren, Geräte"],
["Gesundheit","Brille, Zahnarzt, Zuzahlungen, Medikamente"],
["Kleidung","Kleidung und Schuhe für alle"],
["Eigene Rücklage 1",""],["Eigene Rücklage 2",""],["Eigene Rücklage 3",""],["Eigene Rücklage 4",""],["Eigene Rücklage 5",""]];
const NT=TOEPFE.length, NR=RUECK.length;

function freshState(){
  const now=new Date();
  return {v:2,jahr:now.getFullYear(),e:[],rg:{},lic:{},
    t:TOEPFE.map(([n,h])=>({n,h,avg:null,b:null})),
    r:RUECK.map(([n,h])=>({n,h,k:null,s:null})),
    sb:null,kaeufe:[],extra:[],
    m:MON.map(()=>({closed:false,spar:null,rueck:null,rIdx:null,naechst:null,fehl:"",ueb:null}))};
}
let S=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&(s.v===1||s.v===2)&&s.t&&s.m){migrate(s);return s;}}catch(e){}
  return freshState();
}
function migrate(s){
  if(s.v===1){ // Wochensummen aus Version 1 in Einträge umwandeln
    s.e=[]; s.rg={};
    s.m.forEach((M,mi)=>{
      (M.w||[]).forEach((ws,ti)=>ws.forEach((v,k)=>{
        if(v!=null&&v!==0){const d=new Date(s.jahr,mi,k*7+1,12);
          s.e.push({id:"w"+mi+"_"+ti+"_"+k,datum:d.toISOString().slice(0,10),ort:"",artikel:"Wochensumme (übernommen)",gruppe:null,betrag:v,t:ti,r:null});}
      }));
      delete M.w; M.closed=!!M.closed;
    });
    s.v=2;
  }
  s.e=s.e||[]; s.rg=s.rg||{}; s.lic=s.lic||{};
  // Alt: "Haus & Gesundheit" in "Haus" und "Gesundheit" teilen, auf 12 Rücklagen erweitern
  if(s.r.length===8&&s.r[4].n==="Haus & Gesundheit"){
    const sh=i=>(i!=null&&i>=5)?i+2:i;
    s.r[4].n="Haus"; s.r[4].h="Reparaturen, Möbel, Renovieren, Geräte";
    s.r.splice(5,0,{n:"Gesundheit",h:"Brille, Zahnarzt, Zuzahlungen, Medikamente",k:null,s:null});
    s.r.splice(6,0,{n:"Kleidung",h:"Kleidung und Schuhe für alle",k:null,s:null});
    (s.kaeufe||[]).forEach(e=>e.r=sh(e.r)); (s.extra||[]).forEach(e=>e.r=sh(e.r)); s.m.forEach(M=>M.rIdx=sh(M.rIdx));
  }
  const fresh=freshState();
  while(s.r.length<12){const k=s.r.length;s.r.push({n:fresh.r[k]?fresh.r[k].n:"Eigene Rücklage "+(k-6),h:fresh.r[k]?fresh.r[k].h:"",k:null,s:null});}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let UI={v:"start",m:(()=>{const d=new Date();return d.getFullYear()===S.jahr?d.getMonth():0;})()};

const N0=x=>(x==null||isNaN(x))?0:x;
const r2=x=>Math.round(x*100)/100;
const eurF=new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"});
const eur=x=>x==null?"":(x===0?"–":eurF.format(x));
const eur0=x=>x==null?"":eurF.format(x);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const numStr=x=>x==null?"":String(x).replace(".",",");
const parseNum=s=>{s=String(s).trim().replace(/\s|€/g,"");if(s==="")return null;if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");const n=parseFloat(s);return isNaN(n)?null:n;};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function nin(path,val,extra=""){return `<input class="num" inputmode="decimal" data-p="${path}" data-ty="n" value="${numStr(val)}" ${extra}>`;}
function tin(path,val,extra=""){return `<input class="txt" data-p="${path}" data-ty="t" value="${esc(val)}" ${extra}>`;}

/* ---------- Freischaltung ---------- */
function cyrb53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);}
const CODES={starter:"1aqi4ut1er0",scan:"2aw2nxo9wwv"};
const has=m=>!!(S.lic&&S.lic[m]);
function tryCode(raw){
  const c=String(raw||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(!c)return {ok:false,msg:"Bitte den Code eingeben."};
  const h=cyrb53("bs1|"+c);
  for(const m in CODES){ if(CODES[m]===h){ S.lic=S.lic||{}; S.lic[m]=true; save(); return {ok:true,mod:m,msg:m==="starter"?"Freigeschaltet: Budget-Starter. Viel Erfolg!":"Freigeschaltet: Bon einlesen. Du findest es im Tab „Erfassen“."}; } }
  return {ok:false,msg:"Dieser Code ist ungültig. Bitte prüfe die Schreibweise."};
}
/* ---------- Berechnungen ---------- */
function monthPassed(mi){const n=new Date();return S.jahr<n.getFullYear()||(S.jahr===n.getFullYear()&&mi<n.getMonth());}
function weekSums(mi){
  const w=S.t.map(()=>[0,0,0,0,0]);
  S.e.forEach(e=>{
    if(e.t==null||!e.datum)return;
    const y=+e.datum.slice(0,4),m=+e.datum.slice(5,7)-1,d=+e.datum.slice(8,10);
    if(y!==S.jahr||m!==mi||!w[e.t])return;
    w[e.t][Math.min(4,Math.floor((d-1)/7))]+=N0(e.betrag);
  });
  return w.map(a=>a.map(r2));
}
function calcMonth(mi,depth=0){
  const M=S.m[mi], WK=weekSums(mi), closed=!!M.closed||monthPassed(mi);
  const rows=S.t.map((t,i)=>{
    const w=WK[i], sum=r2(w.reduce((a,x)=>a+x,0)), bud=t.b;
    let left=bud==null?null:r2(bud-sum), st="";
    if(bud!=null) st=sum>bud?"drüber":closed?"Toll gemacht!":sum>=0.8*bud?"knapp":"ok";
    return {sum,bud,wk:bud==null?null:bud/4,left,st,w};
  });
  const tSum=r2(rows.reduce((a,r)=>a+r.sum,0));
  const budRows=rows.filter(r=>r.bud!=null);
  const tBud=r2(budRows.reduce((a,r)=>a+r.bud,0));
  const ueb=mi===0?N0(M.ueb):carry(mi-1);
  const spendBud=r2(rows.filter(r=>N0(r.bud)>0).reduce((a,r)=>a+r.sum,0));
  const J=tBud===0?null:r2(tBud+ueb-spendBud);
  const active=tSum>0;
  const rest=(J==null||!active)?null:Math.max(0,J);
  const fehl=(J==null||!active)?null:Math.max(0,r2(-J));
  const nv=rest==null?null:r2(rest-N0(M.spar)-N0(M.rueck)-N0(M.naechst));
  const carryOut=r2(N0(M.naechst)-(M.fehl==="Ja"?N0(fehl):0));
  const allDone=budRows.length>0&&closed;
  return {rows,tSum,tBud,ueb,J,rest,fehl,nv,carryOut,active,allDone,closed};
}
function carry(mi){ if(mi<0)return 0; const M=S.m[mi]; const c=calcMonth(mi); return c.carryOut; }
function monthMsg(c){
  if(c.tBud===0)return "Lege zuerst im Tab „Budget“ dein Monatsbudget fest. Dann siehst du hier, wie du dich schlägst.";
  if(c.tSum===0)return "Noch keine Einträge in diesem Monat. Trage am Ende der ersten Woche deine Summen ein.";
  if(c.J<0)return "Du liegst über deinem Budget. Kein Drama: Schau dir den Topf mit der roten Ampel an und überlege, was du nächsten Monat anders machen möchtest.";
  if(c.allDone)return "Toll gemacht! Du hast den Monat unter deinem Budget abgeschlossen. Der Betrag in „Noch übrig“ ist Geld, das du gespart hast. Was du damit machst, entscheidest du gleich darunter.";
  return "Bisher liegst du unter deinem Budget. Weiter so!";
}
function restMsg(c,M){
  if(c.rest==null)return "";
  if(c.rest===0)return "Diesen Monat gibt es keinen Rest zu verteilen.";
  if(N0(M.rueck)>0&&M.rIdx==null)return "Wähle noch aus, in welche Rücklage das Geld soll.";
  if(c.nv===0)return "Alles verteilt, super! Überweise den Betrag jetzt auch wirklich, dann ist dein Sparen echt.";
  if(c.nv<0)return "Du hast mehr verteilt, als übrig ist. Bitte prüfe die Beträge.";
  return "Empfehlung: Lege den Rest zuerst aufs Sparkonto oder in eine Rücklage. Dann wird dein Sparen echt.";
}
function fehlMsg(c,M){
  if(c.fehl==null)return "";
  if(c.fehl===0)return "Diesen Monat gibt es keinen Fehlbetrag.";
  if(M.fehl==="Ja")return "Der Fehlbetrag wird im nächsten Monat automatisch vom Budget abgezogen.";
  if(M.fehl==="Nein")return "Der Fehlbetrag wird nicht übernommen. Der nächste Monat startet normal.";
  return "Bitte wähle Ja oder Nein.";
}
function monthsSaved(asOf){
  if(!S.sb)return 0;
  const [y0,m0]=S.sb.split("-").map(Number);
  const d=asOf||{y:new Date().getFullYear(),m:new Date().getMonth()+1};
  return Math.max(0,(d.y-y0)*12+d.m-m0+1);
}
function rStand(i,asOf){
  const r=S.r[i];
  const pm=r.k==null?0:r.k/12;
  const ex=S.extra.filter(e=>e.r===i).reduce((a,e)=>a+N0(e.b),0);
  const mon=S.m.reduce((a,M)=>a+((M.rIdx===i)?N0(M.rueck):0),0);
  const ent=S.kaeufe.filter(e=>e.r===i).reduce((a,e)=>a+N0(e.b),0)+S.e.filter(e=>e.r===i).reduce((a,e)=>a+N0(e.betrag),0);
  return {pm,ms:monthsSaved(asOf),ex,mon,ent,stand:r2(N0(r.s)+pm*monthsSaved(asOf)+ex+mon-ent)};
}

/* ---------- Views ---------- */
const V={},P={};
V.startMain=()=>`
<h2>Monatsflash Budget-Starter</h2>
<p class="sub">Dein Geld im Blick, in vier einfachen Schritten. Ohne Stress und ohne Verzicht.</p>
<div class="card"><b>Schritt 1 · 30 Tage beobachten.</b><br>Erfasse im Tab „Erfassen“ deine Ausgaben: Kassenbon fotografieren oder einlesen, oder Rechnungen und Ausgaben kurz von Hand eintragen. Die Wochensummen im Tab „Monat“ rechnen sich von selbst. Das Budget bleibt noch leer. Du lernst nur kennen, wohin dein Geld wirklich fließt.</div>

<div class="card"><b>Schritt 4 · Jahresabschluss.</b><br>Im Tab „Jahr“ siehst du, was du ausgegeben und wie viel du gespart hast: aufs Sparkonto, in Rücklagen und pro Topf.</div>
<h3>Was bedeuten die Farben?</h3>
<div class="card"><div class="row"><div style="flex:0 0 90px"><input class="num" value="Gelb" readonly style="text-align:center"></div><div class="hint" style="flex:1">Hier schreibst du etwas hinein.</div></div>
<div class="row" style="margin-top:8px"><div style="flex:0 0 90px" class="calc">Grau</div><div class="hint" style="flex:1">Das rechnet sich von selbst. Hier musst du nichts tun.</div></div></div>
<h3>Ein Beispiel</h3>
<div class="card"><b>Einkauf.</b> Du warst einkaufen. Fotografiere den Bon oder lade ihn hoch. Die App liest ihn, sortiert die Artikel in deine Töpfe, und du prüfst nur kurz. Ohne Bon trägst du die Ausgabe einfach von Hand ein.</div>
<div class="card"><b>Rücklage.</b> Das Auto braucht im Jahr ungefähr 900 € (TÜV, Inspektion, Reifen). 900 € ÷ 12 = 75 €. Du legst also jeden Monat 75 € per Dauerauftrag auf ein eigenes Konto zurück. Wird der TÜV fällig, zahlst du von dort und dein Monatsbudget bleibt unberührt.</div>
<h3>Was gehört wohin?</h3>
<div class="card"><b>Alltag.</b> Ins Monatsbudget gehört nur, was du regelmäßig im Alltag brauchst: Essen, Drogerie, Kind, Tanken, Tierfutter, Außer Haus und Freizeit.</div>
<div class="card"><b>Alles andere.</b> Kleidung, Reparaturen, Möbel, Geschenke, Urlaub und andere größere Anschaffungen laufen über die Rücklagen.</div>
<div class="msg">Dein erstes Ziel: einen Monat durchhalten. Das ist schon ein riesiger Schritt.</div>
<div class="card"><div class="lab">Dein Jahr</div><input class="num" inputmode="numeric" data-p="jahr" data-ty="n" value="${S.jahr}"><div class="hint">Es erscheint in den Überschriften und bestimmt, welches Jahr du führst.</div></div>
<p class="hint">Deine Daten bleiben nur auf diesem Gerät. Über das Menü (⋯ oben rechts) kannst du eine Sicherung speichern.</p>`;

V.start=()=>has("starter")?V.startMain():`
<h2>Monatsflash Budget-Starter</h2>
<p class="sub">Dein Geld im Blick, in vier einfachen Schritten. Ohne Stress und ohne Verzicht.</p>
<div class="card soft"><b>Freischaltcode eingeben</b><p class="hint" style="margin:4px 0 8px">Den Code hast du nach deinem Kauf bekommen. Du gibst ihn nur einmal ein.</p>
<input class="txt" id="codeStart" placeholder="Dein Code" autocomplete="off" autocapitalize="characters">
<button class="btn" data-unlock="start" style="width:100%;margin-top:8px">Freischalten</button><div class="hint" id="codeStartMsg" style="margin-top:6px"></div></div>
<div class="card"><b>Was ist das?</b><br>Eine einfache Budget-App für Familien: Du legst fest, wie viel du pro Monat in Alltags-Töpfen ausgeben möchtest, trägst deine Ausgaben ein und siehst sofort, wo du stehst. Für große Ausgaben bildest du Rücklagen, und am Jahresende zeigt dir der Jahresabschluss, was du gespart hast. Deine Daten bleiben nur auf deinem Gerät.</div>
<div class="card"><b>Schon freigeschaltet?</b><br>Dann stelle bitte sicher, dass du die App auf demselben Handy öffnest, auf dem du den Code eingegeben hast. Hast du eine Sicherung, lade sie im Menü (⋯ oben rechts) unter „Sicherung laden“.</div>`;
V.budget=()=>`
<h2>Mein Budget</h2>
<p class="sub">Lege nach 1 bis 2 Monaten fest, wie viel du pro Monat in jedem Topf ausgeben möchtest. Tipp: Nimm deinen Durchschnitt als Ausgangspunkt und setze die Grenze etwas darunter, aber so, dass du dich nicht knebelst.</p>
${S.t.map((t,i)=>`<div class="card">
<div class="lab">Topf</div>${tin(`t.${i}.n`,t.n,'style="font-weight:700"')}
<div class="lab">Was gehört hinein?</div>${tin(`t.${i}.h`,t.h,'style="font-size:13px"')}
<div class="grid2"><div><div class="lab">Durchschnitt der letzten Monate</div>${nin(`t.${i}.avg`,t.avg)}</div>
<div><div class="lab">Mein Monatsbudget</div>${nin(`t.${i}.b`,t.b)}</div></div>
<div class="lab">Pro Woche (Monatsbudget ÷ 4)</div><div class="calc" id="bw-${i}"></div></div>`).join("")}
<div class="card soft"><div class="row"><b>Zusammen</b></div>
<div class="grid2"><div><div class="lab">Durchschnitt</div><div class="calc" id="bta"></div></div><div><div class="lab">Monatsbudget</div><div class="calc" id="btb"></div></div></div>
<div class="lab">Pro Woche</div><div class="calc" id="btw"></div></div>
<p class="hint">Hast du kein Kind oder kein Tier? Lass die Zeile einfach leer. Brauchst du etwas anderes, nutze die „Eigenen Töpfe“ und gib ihnen einen Namen. Die Namen erscheinen automatisch überall. Alles, was hier nicht steht (Kleidung, Reparaturen, Urlaub …), gehört in die Rücklagen.</p>`;
P.budget=()=>{
  S.t.forEach((t,i)=>{$("#bw-"+i).textContent=t.b==null?"":eur0(t.b/4);});
  const sa=S.t.reduce((a,t)=>a+N0(t.avg),0), sb=S.t.reduce((a,t)=>a+N0(t.b),0);
  $("#bta").textContent=eur(r2(sa));$("#btb").textContent=eur(r2(sb));$("#btw").textContent=sb?eur0(sb/4):"";
};

V.monat=()=>{
  const M=S.m[UI.m];
  const chips=MON.map((n,i)=>`<button data-mon="${i}" class="${i===UI.m?"on":""}">${n}</button>`).join("");
  const cards=S.t.map((t,i)=>`<div class="card">
<div class="row"><span class="name">${esc(t.n)}</span><span class="badge" id="st-${i}"></span></div>
<div class="weeks">${[0,1,2,3,4].map(k=>`<div><label>Woche ${k+1}</label><div class="calc wc" id="w-${i}-${k}"></div></div>`).join("")}</div>
<div class="stats"><div>Summe<b id="sum-${i}"></b></div><div>Budget<b id="bud-${i}"></b></div><div>Noch übrig<b id="left-${i}"></b></div></div></div>`).join("");
  const ru=S.r.map((r,i)=>`<option value="${i}" ${M.rIdx===i?"selected":""}>${esc(r.n)}</option>`).join("");
  return `<h2>${MONL[UI.m]} ${S.jahr}</h2>
<p class="sub">Die Wochensummen kommen automatisch aus deinen Bons und Ausgaben (Tab „Erfassen“). Woche 1 sind die Tage 1 bis 7, Woche 2 die Tage 8 bis 14 und so weiter. Ein Wochenfeld wird rot, wenn du in dieser Woche mehr ausgegeben hast, als dein Wochenbudget erlaubt. Das gleicht sich über den Monat oft wieder aus.</p>
<div class="chips" id="chips">${chips}</div>
${cards}
<div class="card soft">
<div class="row"><b>Alle Töpfe zusammen</b></div>
<div class="stats"><div>Summe<b id="tsum"></b></div><div>Budget<b id="tbud"></b></div><div>Noch übrig<b id="tleft"></b></div></div>
<div class="lab">± Übertrag aus dem Vormonat</div>
${UI.m===0?`<div class="hint">Nur bei Übertrag aus dem Vorjahr</div>${nin("m.0.ueb",M.ueb)}`:`<div class="calc" id="ueb"></div><div class="hint">Kommt automatisch aus dem Vormonat.</div>`}
</div>
<div class="msg" id="msg"></div>
<button class="btn sec" id="closeBtn" data-close="1" style="width:100%"></button>
<p class="hint">Mit „Monat abschließen“ zeigt die Ampel „Toll gemacht!“, wenn du dein Budget eingehalten hast. Ist der Monat vorbei, schließt er sich automatisch.</p>
<h3>Was machst du mit dem Rest?</h3>
<p class="hint">Fülle das am Monatsende aus. Unsere Empfehlung: erst sparen, dann den Rest verplanen.</p>
<div class="card">
<div class="row"><span>Restbetrag dieses Monats</span><b id="rest"></b></div>
<div class="lab">→ aufs Sparkonto überweisen</div>${nin(`m.${UI.m}.spar`,M.spar)}
<div class="lab">→ in eine Rücklage legen</div>
<div class="grid2">${nin(`m.${UI.m}.rueck`,M.rueck)}<select data-p="m.${UI.m}.rIdx" data-ty="s"><option value="">Welche Rücklage?</option>${ru}</select></div>
<div class="hint">Der Betrag wird in den Rücklagen automatisch eingetragen.</div>
<div class="lab">→ in den nächsten Monat</div>${nin(`m.${UI.m}.naechst`,M.naechst)}
<div class="row" style="margin-top:8px"><span>Noch nicht verteilt</span><b id="nv"></b></div></div>
<div class="msg" id="restmsg"></div>
<h3>Mehr ausgegeben als geplant?</h3>
<div class="card">
<div class="row"><span>Fehlbetrag dieses Monats</span><b id="fehl"></b></div>
<div class="lab">Minus in den nächsten Monat?</div>
<select data-p="m.${UI.m}.fehl" data-ty="s"><option value="">Bitte wählen</option><option ${M.fehl==="Ja"?"selected":""}>Ja</option><option ${M.fehl==="Nein"?"selected":""}>Nein</option></select>
<div class="hint">Ja = der Fehlbetrag wird im nächsten Monat vom Budget abgezogen. Nein = der nächste Monat startet normal.</div></div>
<div class="msg" id="fehlmsg"></div>`;
};
P.monat=()=>{
  const M=S.m[UI.m], c=calcMonth(UI.m);
  c.rows.forEach((r,i)=>{
    $("#sum-"+i).textContent=eur(r.sum);
    $("#bud-"+i).textContent=r.bud==null?"–":eur(r.bud);
    const l=$("#left-"+i); l.textContent=r.left==null?"–":eur0(r.left); l.className=r.left!=null&&r.left<0?"neg":"";
    const b=$("#st-"+i); b.textContent=r.st; b.className="badge "+({"ok":"b-ok","knapp":"b-knapp","drüber":"b-drueber","Toll gemacht!":"b-toll"}[r.st]||"");
  });
  c.rows.forEach((r,i)=>r.w.forEach((v,k)=>{const el=$("#w-"+i+"-"+k);el.textContent=v?eur0(v):"–";el.classList.toggle("over",r.wk!=null&&v>r.wk);}));
  const cb=$("#closeBtn"); if(cb){cb.textContent=M.closed?"Monat wieder öffnen":"Monat abschließen";cb.style.display=monthPassed(UI.m)?"none":"";}
  $("#tsum").textContent=eur(c.tSum);$("#tbud").textContent=eur(c.tBud);
  const tl=$("#tleft"); tl.textContent=c.J==null?"–":eur0(c.J); tl.className=c.J!=null&&c.J<0?"neg":"";
  if(UI.m>0)$("#ueb").textContent=eur0(c.ueb);
  $("#msg").textContent=monthMsg(c);
  $("#rest").textContent=c.rest==null?"–":eur0(c.rest);
  $("#nv").textContent=c.nv==null?"–":eur0(c.nv);
  $("#restmsg").textContent=restMsg(c,M);$("#restmsg").style.display=c.rest==null?"none":"";
  $("#fehl").textContent=c.fehl==null?"–":eur0(c.fehl);
  $("#fehlmsg").textContent=fehlMsg(c,M);$("#fehlmsg").style.display=c.fehl==null?"none":"";
};

V.rueck=()=>`
<h2>Rücklagen</h2>
<p class="sub">Große Ausgaben stressfrei vorbereiten: Jahreskosten ÷ 12 = dein Sparbetrag pro Monat.</p>
<div class="card"><div class="lab">Sparbeginn (Monat, in dem dein Dauerauftrag zum ersten Mal läuft)</div><input type="month" data-p="sb" data-ty="t" value="${esc(S.sb||"")}"></div>
${S.r.map((r,i)=>`<div class="card">
${tin(`r.${i}.n`,r.n,'style="font-weight:700"')}
${tin(`r.${i}.h`,r.h,'style="font-size:13px;margin-top:6px" placeholder="Wofür? (Beispiele)"')}
<div class="grid2"><div><div class="lab">Geschätzte Kosten pro Jahr</div>${nin(`r.${i}.k`,r.k)}</div>
<div><div class="lab">Schon gespart (Startstand)</div>${nin(`r.${i}.s`,r.s)}</div></div>
<div class="stats"><div>Pro Monat<b id="rpm-${i}"></b></div><div>Monate gespart<b id="rms-${i}"></b></div><div>Stand jetzt<b id="rst-${i}"></b></div></div>
<div class="bar" style="margin-top:8px"><i id="rbar-${i}"></i></div>
<div class="hint" id="rinfo-${i}"></div></div>`).join("")}
<div class="card soft"><div class="grid2"><div><div class="lab">Kosten pro Jahr</div><div class="calc" id="rtk"></div></div><div><div class="lab">Stand jetzt</div><div class="calc" id="rts"></div></div></div>
<div class="lab">Dein Dauerauftrag pro Monat aufs Rücklagenkonto</div><div class="calc" id="rtp" style="font-size:20px;color:var(--acc)"></div>
<div class="hint">Richte ihn am Monatsanfang ein, gleich nach Geldeingang, auf ein eigenes Tagesgeld- oder Unterkonto. Der „Stand jetzt“ ist ein Soll-Stand. Schau ab und zu, ob er zu deinem Kontostand passt.</div></div>
<button class="btn sec" data-addr="1">+ Weitere Rücklage</button>
<h3>Käufe aus der Rücklage</h3>
<p class="hint">Kaufst du etwas, das zu einer Rücklage gehört, wählst du beim Erfassen die Rücklage aus. Es wird dann automatisch von der Rücklage abgezogen und nicht vom Monatsbudget. Hier kannst du zusätzlich Käufe von Hand eintragen.</p>
<div id="listK"></div><button class="btn sec" data-add="kaeufe">+ Kauf eintragen</button>
<h3>Extra eingezahlt</h3>
<p class="hint">Überweist du zusätzlich zum Dauerauftrag Geld aufs Rücklagenkonto (zum Beispiel Geldgeschenke), trägst du es hier ein. Monatsreste aus dem Tab „Monat“ kommen automatisch hinein.</p>
<div id="listE"></div><button class="btn sec" data-add="extra">+ Einzahlung eintragen</button>`;
function listHtml(kind){
  const L=S[kind]; const opts=sel=>S.r.map((r,i)=>`<option value="${i}" ${sel===i?"selected":""}>${esc(r.n)}</option>`).join("");
  if(!L.length)return `<div class="hint" style="margin:6px 0">Noch nichts eingetragen.</div>`;
  return L.map((e,j)=>`<div class="card"><div class="row"><select data-p="${kind}.${j}.r" data-ty="si" style="flex:1"><option value="">Rücklage wählen</option>${opts(e.r)}</select><button class="x" data-del="${kind}.${j}" aria-label="Löschen">✕</button></div>
<div class="grid2"><div><div class="lab">${kind==="kaeufe"?"Wofür?":"Woher?"}</div>${tin(`${kind}.${j}.w`,e.w)}</div><div><div class="lab">Datum</div><input type="date" data-p="${kind}.${j}.d" data-ty="t" value="${esc(e.d||"")}"></div></div>
<div class="lab">Betrag</div>${nin(`${kind}.${j}.b`,e.b)}</div>`).join("");
}
P.rueck=()=>{
  if(!$("#listK").dataset.ok){$("#listK").innerHTML=listHtml("kaeufe");$("#listE").innerHTML=listHtml("extra");$("#listK").dataset.ok=1;}
  let tk=0,ts=0,tp=0;
  S.r.forEach((r,i)=>{
    const x=rStand(i); tk+=N0(r.k);ts+=x.stand;tp+=x.pm;
    $("#rpm-"+i).textContent=r.k==null?"–":eur0(x.pm);
    $("#rms-"+i).textContent=x.ms;
    const st=$("#rst-"+i); st.textContent=eur0(x.stand); st.className=x.stand<0?"neg":"";
    $("#rbar-"+i).style.width=(N0(r.k)>0?Math.min(1,Math.max(0,x.stand/r.k))*100:0)+"%";
    const parts=[];if(x.mon)parts.push("aus Monatsresten "+eur0(r2(x.mon)));if(x.ex)parts.push("extra "+eur0(r2(x.ex)));if(x.ent)parts.push("entnommen "+eur0(r2(x.ent)));
    $("#rinfo-"+i).textContent=parts.join(" · ");
  });
  $("#rtk").textContent=eur(r2(tk));$("#rts").textContent=eur(r2(ts));$("#rtp").textContent=eur(r2(tp));
};

V.jahr=()=>{
  const C=MON.map((_,i)=>calcMonth(i));
  const act=C.filter(c=>c.active).length;
  const ausg=r2(C.reduce((a,c)=>a+c.tSum,0));
  const spar=r2(S.m.reduce((a,M)=>a+N0(M.spar),0)), rue=r2(S.m.reduce((a,M)=>a+N0(M.rueck),0));
  const gespart=r2(spar+rue);
  const bud=r2(C.filter(c=>c.active).reduce((a,c)=>a+c.tBud,0));
  const nvT=r2(C.reduce((a,c)=>a+(c.active&&c.nv!=null?c.nv:0),0));
  const ml=C.map((c,i)=>{const M=S.m[i];return `<tr><td>${MONL[i]}</td><td>${eur(c.tSum)}</td><td>${c.active?eur(c.tBud):""}</td><td class="${c.J<0?"neg":""}">${c.active&&c.J!=null?eur0(c.J):""}</td><td>${eur(N0(M.spar))}</td><td>${eur(N0(M.rueck))}</td><td>${eur(c.carryOut)}</td><td>${c.active&&c.nv!=null?eur(c.nv):""}</td></tr>`;}).join("");
  const tr=S.t.map((t,i)=>{
    const a=r2(C.reduce((s,c)=>s+c.rows[i].sum,0));
    const b=r2(C.filter(c=>c.active).reduce((s,c)=>s+N0(c.rows[i].bud),0));
    const d=b===0?null:r2(b-a);
    return {t,a,b,d,avg:act?a/act:null,row:C.map(c=>c.rows[i].sum)};
  });
  const rows2=tr.map(x=>`<tr><td>${esc(x.t.n)}</td><td>${eur(x.a)}</td><td>${eur(x.b)}</td><td class="${x.d!=null&&x.d<0?"neg":""}">${x.d==null?"":eur0(x.d)}</td><td>${x.avg==null?"":eur(r2(x.avg))}</td></tr>`).join("");
  const grid=tr.map(x=>`<tr><td>${esc(x.t.n)}</td>${x.row.map(v=>`<td>${eur(v)}</td>`).join("")}<td><b>${eur(x.a)}</b></td></tr>`).join("");
  const gt=`<tr class="tot"><td>Zusammen</td>${C.map(c=>`<td>${eur(c.tSum)}</td>`).join("")}<td>${eur(ausg)}</td></tr>`;
  const rk=S.r.map((r,i)=>{const x=rStand(i);return `<tr><td>${esc(r.n)}</td><td>${eur(N0(r.k))}</td><td>${eur(r2(x.pm))}</td><td>${eur(r2(x.ent))}</td><td class="${x.stand<0?"neg":""}">${eur(x.stand)}</td></tr>`;}).join("");
  const rt=S.r.reduce((a,r,i)=>{const x=rStand(i);a.k+=N0(r.k);a.p+=x.pm;a.e+=x.ent;a.s+=x.stand;return a;},{k:0,p:0,e:0,s:0});
  return `<h2>Mein Jahresabschluss ${S.jahr}</h2>
<p class="sub">Hier läuft alles zusammen. Das rechnet sich von selbst aus deinen Monaten.</p>
<div class="tiles">
<div class="tile"><b>${eur(ausg)}</b><span>Ausgegeben im Jahr</span></div>
<div class="tile"><b>${act}</b><span>Monate mit Einträgen</span></div>
<div class="tile"><b>${act?eur(r2(ausg/act)):"–"}</b><span>Ø Ausgaben pro Monat</span></div>
<div class="tile"><b>${eur(spar)}</b><span>Aufs Sparkonto überwiesen</span></div>
<div class="tile"><b>${eur(rue)}</b><span>In Rücklagen gelegt</span></div>
<div class="tile"><b>${eur(gespart)}</b><span>Aktiv gespart insgesamt</span></div></div>
<div class="msg">${gespart>0?"Super: Du hast in diesem Jahr aktiv Geld zur Seite gelegt. Das darfst du feiern!":"Trage in den Monatsblättern ein, was du mit dem Rest machst. Dann siehst du hier dein Erspartes."}</div>
<h3>Monat für Monat</h3>
<div class="scroll"><table><tr><th>Monat</th><th>Ausgegeben</th><th>Budget</th><th>Noch übrig</th><th>Sparkonto</th><th>Rücklagen</th><th>Übertrag</th><th>Nicht verteilt</th></tr>${ml}
<tr class="tot"><td>Zusammen</td><td>${eur(ausg)}</td><td>${eur(bud)}</td><td></td><td>${eur(spar)}</td><td>${eur(rue)}</td><td></td><td>${eur(nvT)}</td></tr></table></div>
<p class="hint">„Noch übrig“ und „Übertrag“ werden nicht addiert, weil ein Übertrag sonst doppelt zählen würde.</p>
<h3>Wohin ist das Geld gegangen?</h3>
<div class="scroll"><table><tr><th>Topf</th><th>Ausgegeben</th><th>Budget</th><th>Unterschied</th><th>Ø/Monat</th></tr>${rows2}
<tr class="tot"><td>Zusammen</td><td>${eur(ausg)}</td><td>${eur(bud)}</td><td></td><td>${act?eur(r2(ausg/act)):""}</td></tr></table></div>
<h3>Topf für Topf, Monat für Monat</h3>
<div class="scroll"><table><tr><th>Topf</th>${MON.map(m=>`<th>${m}</th>`).join("")}<th>Jahr</th></tr>${grid}${gt}</table></div>
<h3>Meine Rücklagen</h3>
<div class="scroll"><table><tr><th>Rücklage</th><th>Kosten/Jahr</th><th>Pro Monat</th><th>Entnommen</th><th>Stand</th></tr>${rk}
<tr class="tot"><td>Zusammen</td><td>${eur(r2(rt.k))}</td><td>${eur(r2(rt.p))}</td><td>${eur(r2(rt.e))}</td><td>${eur(r2(rt.s))}</td></tr></table></div>`;
};


V.erfassen=()=>{
  const chips=MON.map((n,i)=>`<button data-mon="${i}" class="${i===UI.m?"on":""}">${n}</button>`).join("");
  return `<h2>Erfassen</h2>
<p class="sub">Kassenbon einlesen oder Ausgaben von Hand eintragen. Die Wochensummen im Tab „Monat“ rechnen sich daraus von selbst.</p>
${has("scan")?"":`<div class="card soft"><b>🔒 Bon einlesen (Erweiterung)</b><p class="hint" style="margin:4px 0 0">Mit der Erweiterung fotografierst du deinen Kassenbon, und die App sortiert alle Artikel in deine Töpfe. Den Code für die Erweiterung gibst du im Menü (⋯ oben rechts) unter „Freischalten“ ein. Ausgaben von Hand eintragen kannst du auch ohne.</p></div>`}
<div ${has("scan")?"":"hidden"}>
<h3 style="margin-top:6px">Kassenbon einlesen</h3>
<div class="scanbtns">
<button class="btn" data-scan="foto">📷 Bon fotografieren</button>
<button class="btn sec" data-scan="datei">📄 Foto oder PDF wählen</button>
<button class="btn sec" data-scan="text">📋 Text einfügen</button>
<button class="btn sec" data-scan="ki">✨ Vorlage für KI-App</button></div>
<input type="file" id="fFoto" accept="image/*" capture="environment" hidden>
<input type="file" id="fDatei" accept="application/pdf,image/*,text/plain,.txt,.pdf" hidden>
<div id="textWrap" hidden class="card"><textarea id="bonText" placeholder="Bon-Text hier einfügen"></textarea><button class="btn" data-scan="textgo" style="margin-top:8px">Text auswerten</button></div>
<div class="hint" id="scanMsg"></div>
<div id="rv" hidden class="card soft"></div>
</div>
<h3>Ausgabe oder Rechnung von Hand eintragen</h3>
<div class="card">
<div class="grid2"><div><div class="lab">Datum</div><input type="date" id="mDatum" value="${new Date().toISOString().slice(0,10)}"></div>
<div><div class="lab">Betrag</div><input class="num" inputmode="decimal" id="mBetrag" placeholder="0,00"></div></div>

/* --- Bon einlesen --- */
const TESS="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFW="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const loaded={};
let rv=null, rvDupOk=false;
function setScan(t,cls){const m=document.getElementById("scanMsg");if(!m)return;m.className="hint "+(cls||"");m.textContent=t;}
  function loadScript(src){
    return new Promise(function(res,rej){
      if(loaded[src])return res();
      var s=document.createElement("script");s.src=src;
      s.onload=function(){loaded[src]=1;res()};
      s.onerror=function(){rej(new Error("Das Auslese-Modul konnte nicht geladen werden. Dafür wird beim ersten Mal Internet gebraucht."))};
      document.head.appendChild(s);
    });
  }
  function prepCanvas(src,w,h){
    var sc=w<1600?1600/w:(w>2600?2600/w:1);
    var c=document.createElement("canvas");c.width=Math.round(w*sc);c.height=Math.round(h*sc);
    var x=c.getContext("2d");x.drawImage(src,0,0,c.width,c.height);
    try{
      var id=x.getImageData(0,0,c.width,c.height),d=id.data,hist=new Array(256).fill(0),i,g;
      for(i=0;i<d.length;i+=4){g=Math.round(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114);d[i]=d[i+1]=d[i+2]=g;hist[g]++}
      var tot=c.width*c.height,acc=0,lo=0,hi=255;
      for(i=0;i<256;i++){acc+=hist[i];if(acc>tot*0.02){lo=i;break}}
      acc=0;for(i=255;i>=0;i--){acc+=hist[i];if(acc>tot*0.2){hi=i;break}}
      if(hi-lo<30){lo=0;hi=255}
      for(i=0;i<d.length;i+=4){g=Math.max(0,Math.min(255,Math.round((d[i]-lo)*255/(hi-lo))));d[i]=d[i+1]=d[i+2]=g}
      x.putImageData(id,0,0);
    }catch(e){}
    return c;
  }
  function fileToCanvas(file){
    return new Promise(function(res,rej){
      var url=URL.createObjectURL(file),img=new Image();
      img.onload=function(){URL.revokeObjectURL(url);res(prepCanvas(img,img.naturalWidth,img.naturalHeight))};
      img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("Das Bild konnte nicht gelesen werden."))};
      img.src=url;
    });
  }
  function ocr(canvas){
    return loadScript(TESS).then(function(){
      return Tesseract.createWorker("deu",1,{logger:function(m){
        if(m.status==="recognizing text")setScan("Text wird erkannt … "+Math.round(m.progress*100)+" %");
        else setScan("Sprachdaten werden vorbereitet … (beim ersten Mal etwas länger)");
      }});
    }).then(function(w){
      return w.setParameters({tessedit_pageseg_mode:"6",preserve_interword_spaces:"1"})
        .then(function(){return w.recognize(canvas)})
        .then(function(r){return w.terminate().then(function(){return r.data.text})});
    });
  }
  function itemsToLines(items){
    var rows=[];
    items.forEach(function(it){
      if(!it.str||!it.str.trim())return;
      var y=Math.round(it.transform[5]),row=null;
      for(var i=0;i<rows.length;i++){if(Math.abs(rows[i].y-y)<=2){row=rows[i];break}}
      if(!row){row={y:y,its:[]};rows.push(row)}
      row.its.push({x:it.transform[4],s:it.str,w:it.width||0});
    });
    rows.sort(function(a,b){return b.y-a.y});
    return rows.map(function(r){
      r.its.sort(function(a,b){return a.x-b.x});
      var out="",endX=null;
      r.its.forEach(function(i){
        if(endX!==null){if(i.x-endX>3)out+="  ";else if(i.x-endX>0.5&&!/\s$/.test(out))out+=" "}
        out+=i.s;endX=i.x+i.w;
      });
      return out.trim();
    }).join("\n");
  }
  function pdfText(file){
    return loadScript(PDFJS).then(function(){
      pdfjsLib.GlobalWorkerOptions.workerSrc=PDFW;return file.arrayBuffer();
    }).then(function(buf){return pdfjsLib.getDocument({data:buf}).promise}).then(function(doc){
      var ps=[];
      for(var i=1;i<=doc.numPages;i++)ps.push(doc.getPage(i).then(function(pg){return pg.getTextContent()}).then(function(tc){return itemsToLines(tc.items)}));
      return Promise.all(ps).then(function(a){
        var t=a.join("\n");
        if(t.replace(/\s/g,"").length>40)return t;
        return doc.getPage(1).then(function(pg){
          var vp=pg.getViewport({scale:2}),c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
          return pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise.then(function(){return ocr(c)});
        });
      });
    });
  }
  function handleFile(f){
    if(!f)return;
    var n=(f.name||"").toLowerCase(),p;
    setScan("Bon wird gelesen …");
    if(f.type==="application/pdf"||/\.pdf$/.test(n))p=pdfText(f);
    else if((f.type||"").indexOf("image/")===0)p=fileToCanvas(f).then(ocr);
    else p=f.text();
    p.then(function(t){startReview(t)}).catch(function(e){setScan("Das hat nicht geklappt: "+(e&&e.message?e.message:e),"err")});
  }
  var KI_VORLAGE="Du bekommst das Foto, den Screenshot oder das PDF eines Kassenbons. Bei langen Bons können es mehrere Bilder sein, die sich überlappen: Setze sie in der richtigen Reihenfolge zu einem einzigen Bon zusammen und führe Zeilen, die in zwei Bildern vorkommen, nur einmal auf. Lies alle Artikelzeilen und gib sie als reinen Text aus: pro Artikel eine Zeile, 5 Felder getrennt durch Semikolon, ohne Überschrift, ohne Tabelle, ohne Erklärung.\nAufbau: Bon-Nr.;Datum;Geschäft;Artikel;Betrag\nBeispiel: 1;10.10.2026;Lidl;Paprika rot;3,43\n\nRegeln:\n- Bon-Nr. ist immer 1.\n- Datum als TT.MM.JJJJ.\n- Geschäft: kurzer Name (z. B. Lidl).\n- Artikel genau so schreiben, wie er auf dem Bon steht (ein Semikolon im Artikel weglassen).\n- Betrag in Euro mit Dezimalkomma, ohne €-Zeichen. Bei Menge > 1 den Gesamtbetrag der Zeile.\n- Rabatte, Gutscheine und Pfand-Rückgaben als eigene Zeile mit negativem Betrag.\n- Nicht aufnehmen: Summe, Zahlungsart, MwSt, Karten- und Kundennummern, Namen, Adressen, Uhrzeit.\n- Wenn eine Zeile unleserlich ist: Artikel = [unleserlich] und den Betrag, wenn lesbar.\n\nGib die Zeilen in einem Codeblock aus. Schreibe danach in einer eigenen Zeile: Summe laut Bon: …";
function startReview(text){
  const r=SBParser.parseBon(text,{});
  rv={markt:r.markt||"",datum:r.datum||new Date().toISOString().slice(0,10),belegNr:r.belegNr,summeBon:r.summeBon,warn:r.warnungen,datumFehlt:!r.datum,
      pos:r.positionen.map(p=>{const key=SBParser.normKey(p.name);const lern=S.rg[key];const tg=lern||targetOf(p.gruppe);return {name:p.name,netto:p.netto,gruppe:p.gruppe,target:tg,sicher:p.sicher&&!!tg,key};})};
  rvDupOk=false;
  renderRv();
  setScan(r.positionen.length?r.positionen.length+" Positionen erkannt. Bitte kurz prüfen.":"Es wurden keine Positionen erkannt. Du kannst sie unten von Hand ergänzen oder einen besseren Scan versuchen.",r.positionen.length?"ok":"err");
  $("#rv").scrollIntoView({behavior:"smooth",block:"start"});
}
function rvCheck(){
  const s=r2(rv.pos.reduce((a,p)=>a+N0(p.netto),0)),c=$("#rvChk");
  if(rv.summeBon===null)c.textContent="Erkannt: "+eur0(s)+" · Die Summe laut Bon wurde nicht gefunden.";
  else if(Math.abs(s-rv.summeBon)<0.005){c.className="chk";c.textContent="Summe stimmt: "+eur0(s)+" laut Bon und erkannt ✓";}
  else{c.className="chk err";c.textContent="Summe stimmt nicht: Bon "+eur0(rv.summeBon)+", erkannt "+eur0(s)+" (Unterschied "+eur0(r2(s-rv.summeBon))+")";}
  if(rv.summeBon===null||Math.abs(s-rv.summeBon)<0.005)c.className="chk";
}
function renderRv(){
  const box=$("#rv"); box.hidden=false;
  const ws=rv.warn.filter(w=>!/^Die erkannten Positionen ergeben/.test(w)); if(rv.datumFehlt)ws.push("Das Datum wurde nicht gefunden. Bitte oben eintragen.");
  box.innerHTML=`<b>Bon prüfen</b>
  ${ws.length?`<ul class="hint">${ws.map(w=>"<li>"+esc(w)+"</li>").join("")}</ul>`:""}
  <div class="grid2"><div><div class="lab">Geschäft</div><input class="txt" id="rvMarkt" value="${esc(rv.markt)}"></div><div><div class="lab">Datum</div><input type="date" id="rvDatum" value="${esc(rv.datum)}"></div></div>
  <div id="rvList">${rv.pos.map((p,i)=>`<div class="pos ${p.sicher?"":"unsure"}">
    <div class="r1"><input class="txt" data-rn="${i}" value="${esc(p.name)}" aria-label="Artikel"><input class="num" inputmode="decimal" data-ra="${i}" value="${numStr(p.netto)}" aria-label="Betrag"></div>
    <div class="r1" style="margin-top:6px"><select data-rt="${i}" style="flex:1">${targetOptions(p.target)}</select><button class="x" data-rx="${i}" aria-label="Position entfernen">✕</button></div>
    ${p.sicher?"":`<div class="hint">Bitte prüfen, wohin das gehört.</div>`}</div>`).join("")}</div>
  <button class="btn sec" data-rv="add" style="margin-top:6px">+ Position ergänzen</button>
  <div class="chk" id="rvChk"></div><div class="hint err" id="rvMsg"></div>
  <div class="row" style="margin-top:8px"><button class="btn" data-rv="ok" id="rvOk" style="flex:1">Übernehmen</button><button class="btn sec" data-rv="no">Verwerfen</button></div>`;
  rvCheck();
}
function rvCommit(){
  const msg=$("#rvMsg");msg.textContent="";
  const markt=$("#rvMarkt").value.trim(),datum=$("#rvDatum").value;
  if(!markt){msg.textContent="Bitte das Geschäft eintragen, zum Beispiel Lidl.";return;}
  if(!datum){msg.textContent="Bitte das Datum eintragen.";return;}
  if(!rv.pos.length){msg.textContent="Es gibt keine Positionen.";return;}
  for(const p of rv.pos){ if(!p.name.trim()){msg.textContent="Bei einer Position fehlt der Artikelname.";return;} if(!p.target){msg.textContent="Bitte bei jeder Position auswählen, wohin sie gehört.";return;} }
  const beleg=rv.belegNr?markt.toLowerCase().replace(/\s+/g,"")+"|"+datum+"|"+rv.belegNr:"";
  if(beleg&&S.e.some(e=>e.beleg===beleg)&&!rvDupOk){rvDupOk=true;msg.textContent="Dieser Bon ist schon eingetragen. Tippe nochmal, wenn du ihn trotzdem übernehmen willst.";$("#rvOk").textContent="Trotzdem übernehmen";return;}
  const bon=newId("b");
  rv.pos.forEach((p,i)=>{
    const tg=splitTarget(p.target);
    S.e.push({id:newId("p"),bon,beleg,datum,ort:markt,artikel:p.name.trim(),gruppe:p.gruppe,betrag:p.netto,t:tg.t,r:tg.r,summeBon:rv.summeBon});
    if(p.geaendert)S.rg[p.key||SBParser.normKey(p.name)]=p.target;
  });
  const n=rv.pos.length,sum=r2(rv.pos.reduce((a,p)=>a+p.netto,0));
  UI.m=Math.min(+datum.slice(5,7)-1,11);
  save(); rv=null; render(); setScan("Übernommen: "+n+" Positionen, "+eur0(sum)+" bei "+markt+".","ok");
}

function setPath(path,val){
  const k=path.split("."); let o=S;
  for(let i=0;i<k.length-1;i++)o=o[k[i]];
  o[k[k.length-1]]=val;
}

  const el=e.target; if(!el.dataset||!el.dataset.p)return;
  const ty=el.dataset.ty; let val;
  if(ty==="n")val=parseNum(el.value);

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  if(b.dataset.unlock){doUnlock("#codeStart","#codeStartMsg");return;}
  if(b.dataset.scan){
    const k=b.dataset.scan;
    if(k==="foto"){$("#fFoto").value="";$("#fFoto").click();}
    else if(k==="datei"){$("#fDatei").value="";$("#fDatei").click();}
    else if(k==="text"){const w=$("#textWrap");w.hidden=!w.hidden;if(!w.hidden)$("#bonText").focus();}
    else if(k==="textgo"){const t=$("#bonText").value;if(!t.trim()){setScan("Bitte zuerst den Text des Bons einfügen.","err");return;}startReview(t);}
    else if(k==="ki"){
      const ok=()=>setScan("Vorlage kopiert. Füge sie in deiner KI-App ein und lade das Foto des Bons dazu hoch (Karten- und Kundennummern vorher abdecken). Kopiere dann die Antwort und füge sie unter „Text einfügen“ ein.","ok");
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(KI_VORLAGE).then(ok,()=>setScan("Kopieren nicht möglich.","err"));else setScan("Kopieren nicht möglich.","err");
    }
    return;
  }
  if(b.dataset.rv){
    if(b.dataset.rv==="no"){rv=null;$("#rv").hidden=true;setScan("");}
    else if(b.dataset.rv==="add"){rv.pos.push({name:"",netto:0,gruppe:"Nicht zugeordnet",target:"",sicher:false,geaendert:true});renderRv();}
    else if(b.dataset.rv==="ok")rvCommit();
    return;
  }
  if(b.dataset.rx!=null){rv.pos.splice(+b.dataset.rx,1);renderRv();return;}
  if(b.id==="mAdd"){
    const bt=parseNum($("#mBetrag").value),zl=$("#mZiel").value,dt=$("#mDatum").value,m=$("#mMsg");
    if(bt==null||bt<=0){m.className="hint err";m.textContent="Bitte einen Betrag eintragen.";return;}
    if(!zl){m.className="hint err";m.textContent="Bitte auswählen, wohin die Ausgabe gehört.";return;}
    if(!dt){m.className="hint err";m.textContent="Bitte das Datum eintragen.";return;}
    const tg=splitTarget(zl),notiz=$("#mNotiz").value.trim();
    S.e.push({id:newId("m"),datum:dt,ort:"",artikel:notiz,gruppe:null,betrag:r2(bt),t:tg.t,r:tg.r});
    save(); UI.m=+dt.slice(5,7)-1; $("#mBetrag").value="";$("#mNotiz").value="";
    m.className="hint ok";m.textContent="Eingetragen: "+eur0(r2(bt))+" · "+(tg.t!=null?S.t[tg.t].n:"Rücklage "+S.r[tg.r].n);
    $("#chips").innerHTML=MON.map((n,i)=>`<button data-mon="${i}" class="${i===UI.m?"on":""}">${n}</button>`).join(""); paint(); return;
  }
  if(b.dataset.dele){if(confirm("Diesen Eintrag löschen?")){S.e=S.e.filter(x=>x.id!==b.dataset.dele);save();paint();}return;}
  if(b.dataset.delbon){if(confirm("Den ganzen Bon löschen?")){S.e=S.e.filter(x=>x.bon!==b.dataset.delbon);save();paint();}return;}
  if(b.dataset.close){S.m[UI.m].closed=!S.m[UI.m].closed;save();paint();return;}
  if(b.dataset.v){go(b.dataset.v);return;}
  if(b.dataset.mon!=null){UI.m=+b.dataset.mon;if(UI.v==='erfassen'){$$('#chips button').forEach((x,i)=>x.classList.toggle('on',i===UI.m));paint();}else render();return;}
  if(b.dataset.addr){S.r.push({n:"Eigene Rücklage "+(S.r.length-6),h:"",k:null,s:null});save();render();return;}
  if(b.dataset.add){
    S[b.dataset.add].push({r:null,w:"",d:new Date().toISOString().slice(0,10),b:null});
    save(); const k=b.dataset.add; $(k==="kaeufe"?"#listK":"#listE").innerHTML=listHtml(k); paint(); return;
  }
  if(b.dataset.del){
    const [k,j]=b.dataset.del.split("."); S[k].splice(+j,1); save();
    $(k==="kaeufe"?"#listK":"#listE").innerHTML=listHtml(k); paint(); return;
  }
});

$("#file").onchange=ev=>{
  const f=ev.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{const d=JSON.parse(rd.result); if(!(d&&(d.v===1||d.v===2)&&d.t&&d.m&&d.r))throw 0;
      if(!confirm("Deine aktuellen Daten werden durch die Sicherung ersetzt. Fortfahren?"))return;
      migrate(d); d.lic=Object.assign({},S.lic||{},d.lic||{}); S=d; save(); menu.classList.remove("on"); render();
    }catch(e){alert("Diese Datei ist keine gültige Sicherung.");}
  };
  rd.readAsText(f); ev.target.value="";
};
$("#mPrint").onclick=()=>{menu.classList.remove("on");window.print();};
$("#mReset").onclick=()=>{
  if(!confirm("Wirklich ALLE Daten löschen? Das kannst du nicht rückgängig machen. Speichere vorher eine Sicherung."))return;
  const lic=S.lic; S=freshState(); S.lic=lic; save(); menu.classList.remove("on"); go("start");
};
$("#mNew").onclick=()=>{
  if(!confirm("Neues Jahr beginnen? Eine Sicherung des alten Jahres wird gespeichert. Dein Budget und deine Rücklagen-Stände werden übernommen, die Monate beginnen leer. Ein offener Übertrag aus Dezember wandert in den Januar."))return;
  exportData();
  const y=S.jahr, asOf={y:y,m:12};
  const stands=S.r.map((_,i)=>rStand(i,asOf).stand);
  const dec=carry(11);
  S.r.forEach((r,i)=>{r.s=r2(stands[i]);});
  S.sb=(y+1)+"-01"; S.kaeufe=[]; S.extra=[]; S.e=[]; S.jahr=y+1;
  S.m=freshState().m; S.m[0].ueb=dec||null;
  UI.m=0; save(); menu.classList.remove("on"); go("monat");
};
render();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body></html>
